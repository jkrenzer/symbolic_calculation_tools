[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "symbolic-calculation-tools"
version = "0.1.0"
description = "Tools for symbolic calculation workflows."
readme = "README.md"
authors = [{ name = "jkrenzer" }]
requires-python = ">=3.14,<4.0"
dependencies = []

[tool.poetry]
packages = [{ include = "symbolic_calculation_tools", from = "src" }]

[tool.poetry.group.dev.dependencies]
commitizen = "*"
prek = "*"
pytest = "*"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["pyproject.toml:project.version", "src/symbolic_calculation_tools/__init__.py:__version__"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
